<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button {
            background-color: #0070f3;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0051a2;
        }
        #status {
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Entre em Contato</h2>
    <form id="emailForm">
        <label for="email">Seu E-mail:</label>
        <input type="email" id="email" placeholder="seu@email.com" required>

        <label for="assunto">Assunto:</label>
        <input type="text" id="assunto" placeholder="Assunto da mensagem" required>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" placeholder="Escreva sua mensagem aqui..." required></textarea>

        <button type="submit" id="btnEnviar">Enviar Email</button>
    </form>

    <p id="status"></p>

    <script>
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita o recarregamento da página

            const email = document.getElementById('email').value;
            const assunto = document.getElementById('assunto').value;
            const mensagem = document.getElementById('mensagem').value;
            const statusText = document.getElementById('status');
            const btnEnviar = document.getElementById('btnEnviar');

            statusText.innerText = "Enviando...";
            statusText.style.color = "black";
            btnEnviar.disabled = true;

            try {
                // Requisição para a Serverless Function da Vercel
                const response = await fetch('/api/enviar-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, assunto, mensagem })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    statusText.innerText = "Email enviado com sucesso!";
                    statusText.style.color = "green";
                    document.getElementById('emailForm').reset();
                } else {
                    statusText.innerText = "Erro ao enviar: " + (result.error || "Tente novamente.");
                    statusText.style.color = "red";
                }
            } catch (error) {
                console.error(error);
                statusText.innerText = "Erro de conexão com o servidor.";
                statusText.style.color = "red";
            } finally {
                btnEnviar.disabled = false;
            }
        });
    </script>
</body>
</html>
